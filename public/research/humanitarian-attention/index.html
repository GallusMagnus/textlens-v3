  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;humanitarian-attention-dashboard-auditable&quot; class=&quot;had-shell&quot;&gt;
  &lt;style&gt;
    #humanitarian-attention-dashboard-auditable {
      --had-bg: var(--background, #fbfaf8);
      --had-fg: var(--foreground, #191714);
      --had-muted: var(--muted-foreground, #68635d);
      --had-border: var(--border, #d8d2c8);
      --had-card: var(--card, #fffdfa);
      --had-soft: color-mix(in srgb, var(--muted, #ece7df) 70%, transparent);
      --had-observed: var(--viz-series-1, #2d6cdf);
      --had-expected: var(--viz-series-2, #a05a2c);
      --had-positive: var(--viz-series-3, #247a55);
      --had-negative: var(--viz-series-4, #a04444);
      color: var(--had-fg);
      background: transparent;
      font-size: var(--font-size-base, 14px);
    }

    #humanitarian-attention-dashboard-auditable * {
      box-sizing: border-box;
    }

    #humanitarian-attention-dashboard-auditable .had-panel {
      border: 1px solid var(--had-border);
      background: color-mix(in srgb, var(--had-card) 92%, var(--had-bg) 8%);
      border-radius: 8px;
      padding: 14px;
    }

    #humanitarian-attention-dashboard-auditable .had-top {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    #humanitarian-attention-dashboard-auditable .had-stat-label,
    #humanitarian-attention-dashboard-auditable .had-source,
    #humanitarian-attention-dashboard-auditable .had-table th,
    #humanitarian-attention-dashboard-auditable .had-note,
    #humanitarian-attention-dashboard-auditable .had-small {
      color: var(--had-muted);
    }

    #humanitarian-attention-dashboard-auditable .had-stat-value {
      margin-top: 7px;
      font-weight: 500;
      font-size: 1.35em;
    }

    #humanitarian-attention-dashboard-auditable .had-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    #humanitarian-attention-dashboard-auditable .had-control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    #humanitarian-attention-dashboard-auditable .had-journal-group {
      flex: 1 1 100%;
      align-items: stretch;
    }

    #humanitarian-attention-dashboard-auditable .had-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--had-border);
      border-radius: 8px;
      padding: 7px 9px;
      background: color-mix(in srgb, var(--had-card) 86%, var(--had-soft) 14%);
      min-height: 34px;
    }

    #humanitarian-attention-dashboard-auditable select,
    #humanitarian-attention-dashboard-auditable input {
      color: var(--had-fg);
      background: var(--had-bg);
      border: 1px solid var(--had-border);
      border-radius: 6px;
      padding: 6px 8px;
      min-height: 32px;
    }

    #humanitarian-attention-dashboard-auditable input[type=&quot;checkbox&quot;] {
      min-height: auto;
      width: 16px;
      height: 16px;
      padding: 0;
    }

    #humanitarian-attention-dashboard-auditable button {
      color: inherit;
      font: inherit;
    }

    #humanitarian-attention-dashboard-auditable .had-main {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
      gap: 12px;
      align-items: start;
    }

    #humanitarian-attention-dashboard-auditable .had-chart-header,
    #humanitarian-attention-dashboard-auditable .had-detail-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    #humanitarian-attention-dashboard-auditable .had-title {
      font-weight: 500;
    }

    #humanitarian-attention-dashboard-auditable .had-source {
      text-align: right;
    }

    #humanitarian-attention-dashboard-auditable .had-bars {
      display: grid;
      gap: 9px;
    }

    #humanitarian-attention-dashboard-auditable .had-row {
      display: grid;
      grid-template-columns: minmax(112px, 150px) minmax(0, 1fr) minmax(66px, 84px);
      gap: 10px;
      align-items: center;
      padding: 7px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      width: 100%;
      text-align: left;

      overflow-wrap: anywhere;
    }

    #humanitarian-attention-dashboard-auditable .had-track {

      height: 30px;
      border-radius: 6px;
      background: var(--had-soft);
      overflow: hidden;
    }

    #humanitarian-attention-dashboard-auditable .had-bar,
    #humanitarian-attention-dashboard-auditable .had-expected {
      position: absolute;
      left: 0;
      height: 8px;
      border-radius: 5px;
      min-width: 1px;
    }

      top: 6px;
      background: color-mix(in srgb, var(--had-observed) 86%, transparent);
    }

    #humanitarian-attention-dashboard-auditable .had-expected {
      bottom: 6px;

    }

    #humanitarian-attention-dashboard-auditable .had-ratio {

    }

      color: var(--had-negative);
    }

    #humanitarian-attention-dashboard-auditable .had-ratio.over {
      color: var(--had-positive);
    }

    #humanitarian-attention-dashboard-auditable .had-legend,
    #humanitarian-attention-dashboard-auditable .had-term-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    #humanitarian-attention-dashboard-auditable .had-methodology {
      display: grid;
      gap: 12px;
      margin-top: 10px;

    #humanitarian-attention-dashboard-auditable .had-swatch {

      height: 8px;
      border-radius: 5px;
      display: inline-block;
      margin-right: 5px;
      vertical-align: middle;
    }

    #humanitarian-attention-dashboard-auditable .observed {
      background: color-mix(in srgb, var(--had-observed) 86%, transparent);
    }

    #humanitarian-attention-dashboard-auditable .expected {
      background: color-mix(in srgb, var(--had-expected) 78%, transparent);
    }

    #humanitarian-attention-dashboard-auditable .had-pill {

      border-radius: 999px;
      padding: 3px 7px;

      color: var(--had-fg);
    }

    #humanitarian-attention-dashboard-auditable .had-detail {
      display: grid;
      gap: 12px;
    }

    #humanitarian-attention-dashboard-auditable .had-split-row {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr) 46px;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    #humanitarian-attention-dashboard-auditable .had-mini-track {
      height: 10px;
      border-radius: 5px;
      background: var(--had-soft);
      overflow: hidden;
    }

    #humanitarian-attention-dashboard-auditable .had-mini-bar {
      height: 10px;
      border-radius: 5px;
      background: color-mix(in srgb, var(--had-observed) 76%, transparent);

      gap: 8px;
      max-height: 420px;
      overflow: auto;

      padding-top: 8px;

      gap: 10px;
      margin-bottom: 12px;

      padding-top: 8px;

    #humanitarian-attention-dashboard-auditable .had-table-wrap {

      margin-top: 12px;

    #humanitarian-attention-dashboard-auditable .had-table {

      min-width: 760px;

    #humanitarian-attention-dashboard-auditable .had-table th,

    #humanitarian-attention-dashboard-auditable details {
      margin-top: 12px;
    }

    #humanitarian-attention-dashboard-auditable summary {

      font-weight: 500;
    }

    #humanitarian-attention-dashboard-auditable pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--had-fg);
      background: var(--had-soft);
      border-radius: 8px;
      padding: 10px;
    }

    @media (max-width: 760px) {
      #humanitarian-attention-dashboard-auditable .had-top,
      #humanitarian-attention-dashboard-auditable .had-main,
      #humanitarian-attention-dashboard-auditable .had-review-grid {

      }

          description: &#x27;Lancet, BMJ, JAMA, and New England Journal of Medicine&#x27;,
          journalKeys: dataset.journals.filter(journal =&gt; journal.isCore !== false).map(journal =&gt; journal.key),
        },
        {
          id: &#x27;expanded&#x27;,
          name: &#x27;Expanded journals&#x27;,
          description: &#x27;All journals in the dataset&#x27;,
          journalKeys,
        },
      ];
      let selectedCorpusId = corpora[0]?.id || &#x27;core&#x27;;
      const selectedJournalsByCorpus = Object.fromEntries(corpora.map(corpus =&gt; [corpus.id, new Set(corpus.journalKeys)]));
      const searchSince = normalizeDate(dataset.dateRange?.since);
      const searchUntil = normalizeDate(dataset.dateRange?.until);
      const burdenPeriodDefaults = {
        gaza: { start: &#x27;2023-10-07&#x27;, end: searchUntil },
        sudan: { start: &#x27;2023-04-15&#x27;, end: searchUntil },
      };
      const crises = dataset.crises.map(crisis =&gt; {
        const period = burdenPeriodDefaults[crisis.id] || {};
        return {
          ...crisis,
          burdenStart: normalizeDate(crisis.burdenStart || period.start || searchSince),
          burdenEnd: normalizeDate(crisis.burdenEnd || period.end || searchUntil),
        };
      });
      let selectedId = &#x27;gaza&#x27;;
      const candidateStatusLabels = {
        &#x27;counted-selected-crisis&#x27;: &#x27;Counted selected crisis&#x27;,
        &#x27;unsupported-geography&#x27;: &#x27;Unsupported geography&#x27;,
        &#x27;visible-humanitarian-no-geography&#x27;: &#x27;Visible humanitarian, no selected geography&#x27;,
        &#x27;openalex-only&#x27;: &#x27;OpenAlex-only match&#x27;,
      };

      const fmt = new Intl.NumberFormat(&#x27;en&#x27;, { maximumFractionDigits: 0 });
      const fmt1 = new Intl.NumberFormat(&#x27;en&#x27;, { maximumFractionDigits: 1 });
      const corpusById = id =&gt; corpora.find(corpus =&gt; corpus.id === id) || corpora[0];
      const activeJournals = () =&gt; {
        const allowed = new Set(corpusById(selectedCorpusId).journalKeys);
        return Array.from(root.querySelectorAll(&#x27;input[name=&quot;journal&quot;]:checked&#x27;))
          .map(input =&gt; input.value)
          .filter(journal =&gt; allowed.has(journal));
      };

      function normalizeDate(value) {
        return String(value || &#x27;&#x27;).replaceAll(&#x27;/&#x27;, &#x27;-&#x27;);
      }

      function dateRangeLabel() {
        return searchSince &amp;&amp; searchUntil ? searchSince + &#x27; to &#x27; + searchUntil : &#x27;--&#x27;;
      }

      function burdenPeriodLabel(row) {
        return row.burdenStart &amp;&amp; row.burdenEnd ? row.burdenStart + &#x27; to &#x27; + row.burdenEnd : &#x27;--&#x27;;
      }

      function model() {
        const active = activeJournals();
        const rows = crises.map(crisis =&gt; {
          const observed = active.reduce((sum, journal) =&gt; sum + crisis.counts[journal], 0);
          const burden = crisis.severity * crisis.pin * crisis.months;
          return { ...crisis, observed, burden };
        });
        const totalObserved = rows.reduce((sum, row) =&gt; sum + row.observed, 0);
        const totalBurden = rows.reduce((sum, row) =&gt; sum + row.burden, 0);
        rows.forEach(row =&gt; {
          row.expected = totalBurden ? totalObserved * row.burden / totalBurden : 0;
          row.ratio = row.expected ? row.observed / row.expected : 0;
        });
        const sortValue = root.querySelector(&#x27;[data-sort]&#x27;).value;
        rows.sort((a, b) =&gt; {
          if (sortValue === &#x27;ratio-asc&#x27;) return a.ratio - b.ratio;
          if (sortValue === &#x27;observed-desc&#x27;) return b.observed - a.observed;
          if (sortValue === &#x27;burden-desc&#x27;) return b.burden - a.burden;
          return b.ratio - a.ratio;
        });
        return { rows, totalObserved, active };
      }

      function renderStats(rows, totalObserved, active) {
        const source = dataset.dataSource || &#x27;OpenAlex&#x27;;
        const corpus = corpusById(selectedCorpusId);
        root.querySelector(&#x27;[data-total-articles]&#x27;).textContent = fmt.format(totalObserved);
        const candidates = active.reduce((sum, journal) =&gt; sum + (dataset.journalCandidateCounts[journal] || 0), 0);
        root.querySelector(&#x27;[data-candidate-label]&#x27;).textContent = source + &#x27; humanitarian candidates&#x27;;
        root.querySelector(&#x27;[data-candidates]&#x27;).textContent = fmt.format(candidates);
        const uncounted = dataset.candidates.filter(candidate =&gt; active.includes(candidate.journal) &amp;&amp; candidate.reviewStatus !== &#x27;counted-selected-crisis&#x27;).length;
        root.querySelector(&#x27;[data-candidates-note]&#x27;).textContent = fmt.format(uncounted) + &#x27; uncounted candidates in review&#x27;;
        root.querySelector(&#x27;[data-total-note]&#x27;).textContent = corpus.name + &#x27;: &#x27; + fmt.format(active.length) + &#x27; of &#x27; + fmt.format(corpus.journalKeys.length) + &#x27; journals selected&#x27;;
        const withExpected = rows.filter(row =&gt; row.expected &gt; 0);
        const over = withExpected.reduce((best, row) =&gt; !best || row.ratio &gt; best.ratio ? row : best, null);
        const under = withExpected.reduce((best, row) =&gt; !best || row.ratio &lt; best.ratio ? row : best, null);
        root.querySelector(&#x27;[data-extremes]&#x27;).textContent = over &amp;&amp; under ? over.name : &#x27;--&#x27;;
        root.querySelector(&#x27;[data-extreme-note]&#x27;).textContent = over &amp;&amp; under ? fmt1.format(over.ratio) + &#x27;x over; &#x27; + under.name + &#x27; &#x27; + fmt1.format(under.ratio) + &#x27;x&#x27; : &#x27;--&#x27;;
        root.querySelector(&#x27;[data-date-range]&#x27;).textContent = dateRangeLabel();
        root.querySelector(&#x27;[data-date-note]&#x27;).textContent = source === &#x27;PubMed&#x27; ? &#x27;PubMed publication date [dp]&#x27; : &#x27;OpenAlex publication_date&#x27;;
      }

      function renderBars(rows) {
        const bars = root.querySelector(&#x27;[data-bars]&#x27;);
        const maxValue = Math.max(...rows.map(row =&gt; Math.max(row.observed, row.expected)), 1);
        bars.innerHTML = &#x27;&#x27;;
        rows.forEach(row =&gt; {
          const item = document.createElement(&#x27;button&#x27;);
          item.type = &#x27;button&#x27;;
          item.className = &#x27;had-row&#x27;;
          item.setAttribute(&#x27;aria-selected&#x27;, String(row.id === selectedId));
          item.setAttribute(&#x27;aria-label&#x27;, row.name + &#x27;: &#x27; + fmt.format(row.observed) + &#x27; observed, &#x27; + fmt1.format(row.expected) + &#x27; expected, &#x27; + fmt1.format(row.ratio) + &#x27; times expected&#x27;);
          item.addEventListener(&#x27;click&#x27;, () =&gt; {
            selectedId = row.id;
            render();
          });

          const name = document.createElement(&#x27;div&#x27;);
          name.className = &#x27;had-name&#x27;;
          name.textContent = row.name;

          const track = document.createElement(&#x27;div&#x27;);
          track.className = &#x27;had-track&#x27;;
          const observed = document.createElement(&#x27;div&#x27;);
          observed.className = &#x27;had-bar&#x27;;
          observed.style.width = row.observed ? Math.max(1, row.observed / maxValue * 100) + &#x27;%&#x27; : &#x27;0%&#x27;;
          const expected = document.createElement(&#x27;div&#x27;);
          expected.className = &#x27;had-expected&#x27;;
          expected.style.width = row.expected ? Math.max(1, row.expected / maxValue * 100) + &#x27;%&#x27; : &#x27;0%&#x27;;
          track.append(observed, expected);

          const ratio = document.createElement(&#x27;div&#x27;);
          ratio.className = &#x27;had-ratio &#x27; + (row.ratio &gt;= 1 ? &#x27;over&#x27; : &#x27;under&#x27;);
          ratio.textContent = row.expected ? fmt1.format(row.ratio) + &#x27;x&#x27; : &#x27;--&#x27;;

          item.append(name, track, ratio);
          bars.appendChild(item);
        });
      }

      function renderDetail(rows, active) {
        const row = rows.find(item =&gt; item.id === selectedId) || rows[0];
        selectedId = row.id;
        root.querySelector(&#x27;[data-detail-title]&#x27;).textContent = row.name;
        root.querySelector(&#x27;[data-detail-ratio]&#x27;).textContent = row.expected ? fmt1.format(row.ratio) + &#x27;x expected&#x27; : &#x27;--&#x27;;
        root.querySelector(&#x27;[data-detail-metrics]&#x27;).textContent = fmt.format(row.observed) + &#x27; observed; &#x27; + fmt1.format(row.expected) + &#x27; expected; burden &#x27; + fmt1.format(row.burden) + &#x27; index-months; period &#x27; + burdenPeriodLabel(row);

        const geoTerms = root.querySelector(&#x27;[data-geo-terms]&#x27;);
        geoTerms.innerHTML = &#x27;&#x27;;
        row.geoTerms.forEach(term =&gt; {
          const pill = document.createElement(&#x27;span&#x27;);
          pill.className = &#x27;had-pill&#x27;;
          pill.textContent = term;
          geoTerms.appendChild(pill);
        });

        const split = root.querySelector(&#x27;[data-journal-split]&#x27;);
        split.innerHTML = &#x27;&#x27;;
        const splitJournals = active.filter(journal =&gt; row.counts[journal] &gt; 0);
        const visibleJournals = splitJournals.length ? splitJournals : active;
        const max = Math.max(...visibleJournals.map(journal =&gt; row.counts[journal]), 1);
        visibleJournals.forEach(journal =&gt; {
          const splitRow = document.createElement(&#x27;div&#x27;);
          splitRow.className = &#x27;had-split-row&#x27;;
          const label = document.createElement(&#x27;div&#x27;);
          label.textContent = journal;
          label.className = active.includes(journal) ? &#x27;&#x27; : &#x27;had-note&#x27;;
          const track = document.createElement(&#x27;div&#x27;);
          track.className = &#x27;had-mini-track&#x27;;
          const bar = document.createElement(&#x27;div&#x27;);
          bar.className = &#x27;had-mini-bar&#x27;;
          bar.style.width = row.counts[journal] / max * 100 + &#x27;%&#x27;;
          track.appendChild(bar);
          const value = document.createElement(&#x27;div&#x27;);
          value.textContent = fmt.format(row.counts[journal]);
          value.style.textAlign = &#x27;right&#x27;;
          splitRow.append(label, track, value);
          split.appendChild(splitRow);
        });

        renderArticles(row, active);
      }

      function candidateTerms(candidate) {
        const parts = [];
        if (candidate.matchedHumanitarianTerms.length) parts.push(&#x27;humanitarian: &#x27; + candidate.matchedHumanitarianTerms.join(&#x27;; &#x27;));
        if (candidate.matchedSelectedCrises.length) parts.push(&#x27;selected crisis: &#x27; + candidate.matchedSelectedCrises.join(&#x27;; &#x27;));
        if (candidate.matchedSelectedGeoTerms.length) parts.push(&#x27;selected geography: &#x27; + candidate.matchedSelectedGeoTerms.join(&#x27;; &#x27;));
        if (candidate.unsupportedMatches.length) parts.push(&#x27;unsupported: &#x27; + candidate.unsupportedMatches.map(match =&gt; match.name).join(&#x27;; &#x27;));
        return parts.length ? parts.join(&#x27; - &#x27;) : &#x27;no title/abstract-visible humanitarian term&#x27;;
      }

      function reviewCandidates(active) {
        const selected = root.querySelector(&#x27;[data-review-status]&#x27;).value;
        return dataset.candidates
          .filter(candidate =&gt; active.includes(candidate.journal))
          .filter(candidate =&gt; {
            if (selected === &#x27;all&#x27;) return true;
            if (selected === &#x27;uncounted&#x27;) return candidate.reviewStatus !== &#x27;counted-selected-crisis&#x27;;
            return candidate.reviewStatus === selected;
          })
          .sort((a, b) =&gt; {
            const statusCompare = String(a.reviewStatus).localeCompare(String(b.reviewStatus));
            if (selected === &#x27;all&#x27; &amp;&amp; statusCompare) return statusCompare;
            return String(b.date).localeCompare(String(a.date));
          });
      }

      function renderCandidateReview(active) {
        const stats = root.querySelector(&#x27;[data-review-stats]&#x27;);
        const list = root.querySelector(&#x27;[data-candidate-list]&#x27;);
        const activeCandidates = dataset.candidates.filter(candidate =&gt; active.includes(candidate.journal));
        const statuses = [&#x27;counted-selected-crisis&#x27;, &#x27;unsupported-geography&#x27;, &#x27;visible-humanitarian-no-geography&#x27;, &#x27;openalex-only&#x27;];
        stats.innerHTML = &#x27;&#x27;;
        statuses.forEach(status =&gt; {
          const item = document.createElement(&#x27;div&#x27;);
          item.className = &#x27;had-review-stat&#x27;;
          const label = document.createElement(&#x27;div&#x27;);
          label.className = &#x27;had-note&#x27;;
          label.textContent = candidateStatusLabels[status];
          const value = document.createElement(&#x27;div&#x27;);
          value.className = &#x27;had-title&#x27;;
          value.textContent = fmt.format(activeCandidates.filter(candidate =&gt; candidate.reviewStatus === status).length);
          item.append(label, value);
          stats.appendChild(item);
        });

        const candidates = reviewCandidates(active);
        const visible = candidates.slice(0, 80);
        root.querySelector(&#x27;[data-review-note]&#x27;).textContent = fmt.format(candidates.length) + &#x27; matching candidates; showing &#x27; + fmt.format(visible.length);
        list.innerHTML = &#x27;&#x27;;
        if (!visible.length) {
          const empty = document.createElement(&#x27;div&#x27;);
          empty.className = &#x27;had-note&#x27;;
          empty.textContent = &#x27;No candidates in this review group for the selected journals.&#x27;;
          list.appendChild(empty);
          return;
        }
        visible.forEach(candidate =&gt; {
          const item = document.createElement(&#x27;div&#x27;);
          item.className = &#x27;had-candidate&#x27;;
          const link = document.createElement(&#x27;a&#x27;);
          link.href = candidate.url;
          link.target = &#x27;_blank&#x27;;
          link.rel = &#x27;noopener noreferrer&#x27;;
          link.textContent = candidate.title || candidate.id;
          const meta = document.createElement(&#x27;div&#x27;);
          meta.className = &#x27;had-small&#x27;;
          meta.textContent = candidate.journal + &#x27; - &#x27; + (candidate.date || candidate.year) + &#x27; - &#x27; + candidateStatusLabels[candidate.reviewStatus] + &#x27; - &#x27; + candidateTerms(candidate);
          item.append(link, meta);
          list.appendChild(item);
        });
      }

      function renderArticles(row, active) {
        const list = root.querySelector(&#x27;[data-article-list]&#x27;);
        const articles = dataset.articles
          .filter(article =&gt; article.crisisId === row.id &amp;&amp; active.includes(article.journal))
          .sort((a, b) =&gt; String(b.date).localeCompare(String(a.date)));
        root.querySelector(&#x27;[data-article-count]&#x27;).textContent = fmt.format(articles.length);
        list.innerHTML = &#x27;&#x27;;
        if (!articles.length) {
          const empty = document.createElement(&#x27;div&#x27;);
          empty.className = &#x27;had-note&#x27;;
          empty.textContent = &#x27;No audited matches for the selected journals.&#x27;;
          list.appendChild(empty);
          return;
        }
        articles.forEach(article =&gt; {
          const item = document.createElement(&#x27;div&#x27;);
          item.className = &#x27;had-article&#x27;;
          const link = document.createElement(&#x27;a&#x27;);
          link.href = article.url;
          link.target = &#x27;_blank&#x27;;
          link.rel = &#x27;noopener noreferrer&#x27;;
          link.textContent = article.title;
          const meta = document.createElement(&#x27;div&#x27;);
          meta.className = &#x27;had-small&#x27;;
          meta.textContent = article.journal + &#x27; - &#x27; + (article.date || article.year) + &#x27; - humanitarian: &#x27; + article.matchedHumanitarianTerms.join(&#x27;; &#x27;) + &#x27; - geography: &#x27; + article.matchedGeoTerms.join(&#x27;; &#x27;);
          item.append(link, meta);
          list.appendChild(item);
        });
      }

      function renderInputTable() {
        const table = root.querySelector(&#x27;[data-input-table]&#x27;);
        table.innerHTML = &#x27;&#x27;;
        crises.forEach(crisis =&gt; {
          const tr = document.createElement(&#x27;tr&#x27;);
          tr.dataset.inputRowFor = crisis.id;
          const name = document.createElement(&#x27;td&#x27;);
          name.textContent = crisis.name;
          tr.appendChild(name);
          [&#x27;severity&#x27;, &#x27;pin&#x27;, &#x27;months&#x27;].forEach(key =&gt; {
            const td = document.createElement(&#x27;td&#x27;);
            const input = document.createElement(&#x27;input&#x27;);
            input.type = &#x27;number&#x27;;
            input.step = key === &#x27;months&#x27; ? &#x27;1&#x27; : &#x27;0.1&#x27;;
            input.min = &#x27;0&#x27;;
            input.value = String(crisis[key]);
            input.setAttribute(&#x27;aria-label&#x27;, crisis.name + &#x27; &#x27; + key);
            input.addEventListener(&#x27;input&#x27;, () =&gt; {
              crisis[key] = Number(input.value) || 0;
              render();
            });
            td.appendChild(input);
            tr.appendChild(td);
          });
          const period = document.createElement(&#x27;td&#x27;);
          period.className = &#x27;had-period&#x27;;
          period.dataset.periodFor = crisis.id;
          tr.insertBefore(period, tr.children[3]);
          const burden = document.createElement(&#x27;td&#x27;);
          burden.dataset.burdenFor = crisis.id;
          tr.appendChild(burden);
          const audited = document.createElement(&#x27;td&#x27;);
          audited.dataset.auditedFor = crisis.id;
          tr.appendChild(audited);
          table.appendChild(tr);
        });
      }

      function denominatorRows(rows) {
        const ordered = [...rows];
        const sortValue = root.querySelector(&#x27;[data-denominator-sort]&#x27;).value;
        ordered.sort((a, b) =&gt; {
          if (sortValue === &#x27;severity-desc&#x27;) return b.severity - a.severity;
          if (sortValue === &#x27;pin-desc&#x27;) return b.pin - a.pin;
          if (sortValue === &#x27;months-desc&#x27;) return b.months - a.months;
          if (sortValue === &#x27;audited-desc&#x27;) return b.observed - a.observed || b.burden - a.burden;
          if (sortValue === &#x27;name-asc&#x27;) return a.name.localeCompare(b.name);
          return b.burden - a.burden;
        });
        return ordered;
      }

      function updateInputCells(rows) {
        const table = root.querySelector(&#x27;[data-input-table]&#x27;);
        denominatorRows(rows).forEach(row =&gt; {
          const tr = root.querySelector(&#x27;[data-input-row-for=&quot;&#x27; + row.id + &#x27;&quot;]&#x27;);
          if (tr) table.appendChild(tr);
          const period = root.querySelector(&#x27;[data-period-for=&quot;&#x27; + row.id + &#x27;&quot;]&#x27;);
          const burden = root.querySelector(&#x27;[data-burden-for=&quot;&#x27; + row.id + &#x27;&quot;]&#x27;);
          const audited = root.querySelector(&#x27;[data-audited-for=&quot;&#x27; + row.id + &#x27;&quot;]&#x27;);
          if (period) period.textContent = burdenPeriodLabel(row);
          if (burden) burden.textContent = fmt1.format(row.burden);
          if (audited) audited.textContent = fmt.format(row.observed);
        });
      }

      function addMethodologyBlock(container, title, body, bullets = []) {
        const block = document.createElement(&#x27;div&#x27;);
        block.className = &#x27;had-methodology-block&#x27;;
        const heading = document.createElement(&#x27;h4&#x27;);
        heading.textContent = title;
        const paragraph = document.createElement(&#x27;p&#x27;);
        paragraph.className = &#x27;had-small&#x27;;
        paragraph.textContent = body;
        block.append(heading, paragraph);
        if (bullets.length) {
          const list = document.createElement(&#x27;ul&#x27;);
          list.className = &#x27;had-small&#x27;;
          bullets.forEach(text =&gt; {
            const item = document.createElement(&#x27;li&#x27;);
            item.textContent = text;
            list.appendChild(item);
          });
          block.appendChild(list);
        }
        container.appendChild(block);
      }

      function renderMethodology(active) {
        const container = root.querySelector(&#x27;[data-methodology]&#x27;);
        const source = dataset.dataSource || &#x27;OpenAlex&#x27;;
        const corpus = corpusById(selectedCorpusId);
        const activeCandidateTotal = active.reduce((sum, journal) =&gt; sum + (dataset.journalCandidateCounts[journal] || 0), 0);
        container.innerHTML = &#x27;&#x27;;
        addMethodologyBlock(
          container,
          &#x27;Purpose&#x27;,
          &#x27;This dashboard compares observed article-crisis matches with expected coverage derived from a transparent suffering-burden denominator. It is an attention-audit screen, not a finding of editorial intent or political bias by itself.&#x27;
        );
        addMethodologyBlock(
          container,
          &#x27;Publication corpus&#x27;,
          source + &#x27; records are filtered to the publication window &#x27; + dateRangeLabel() + &#x27;. The current view uses &#x27; + corpus.name + &#x27;: &#x27; + fmt.format(active.length) + &#x27; selected journals, &#x27; + fmt.format(activeCandidateTotal) + &#x27; humanitarian candidates, and &#x27; + fmt.format(dataset.articles.filter(article =&gt; active.includes(article.journal)).length) + &#x27; counted article-crisis matches.&#x27;
        );
        if (dataset.pubmedQueries) {
          addMethodologyBlock(
            container,
            &#x27;Retrieval and matching&#x27;,
            &#x27;PubMed retrieval is run once per journal using humanitarian terms in Title/Abstract, the journal name in the Journal field, and publication date [dp]. The geography terms are then applied locally to fetched title and abstract text.&#x27;,
            [
              &#x27;MeSH headings are not used in the current default search.&#x27;,
              &#x27;Full article text is not searched; records with no abstract are counted only if the title carries the required visible terms.&#x27;,
              &#x27;A counted match requires at least one humanitarian term and at least one selected crisis geography term in the fetched title/abstract text.&#x27;,
            ]
          );
        } else {
          addMethodologyBlock(
            container,
            &#x27;Retrieval and matching&#x27;,
            &#x27;The source query retrieves humanitarian candidates, then local screening counts records whose visible title or abstract text contains at least one humanitarian term and one selected crisis geography term.&#x27;
          );
        }
        addMethodologyBlock(
          container,
          &#x27;Suffering denominator&#x27;,
          &#x27;Expected coverage is allocated by burden share, where burden = INFORM severity x people in need in millions x duration months over the listed denominator period.&#x27;,
          [
            &#x27;The current denominator uses one representative severity value and one representative people-in-need value per crisis.&#x27;,
            &#x27;It does not yet use a monthly INFORM severity time series or monthly people-in-need history over the measurement period.&#x27;,
            &#x27;The editable fields allow sensitivity testing, but edits are local to the browser session unless exported or rebuilt into the dataset.&#x27;,
          ]
        );
        addMethodologyBlock(
          container,
          &#x27;Known limitations&#x27;,
          &#x27;The results should be read as a structured signal for further review rather than a complete measure of humanitarian attention.&#x27;,
          [
            &#x27;Article counts do not measure article quality, prominence, tone, length, or clinical/scientific importance.&#x27;,
            &#x27;PubMed coverage excludes relevant non-indexed journalism, policy reports, books, NGO publications, and many non-medical outlets.&#x27;,
            &#x27;The selected crisis geographies are auditable keyword buckets and may miss indirect, regional, or differently named references.&#x27;,
            &#x27;The expanded journal list is broader than the Core 4 but is still not the global scholarly corpus.&#x27;,
            &#x27;A stronger denominator would integrate monthly severity and monthly affected-population estimates, then sum burden-months across the period.&#x27;,
          ]
        );
      }

      function renderDictionary() {
        const terms = root.querySelector(&#x27;[data-humanitarian-terms]&#x27;);
        terms.innerHTML = &#x27;&#x27;;
        dataset.humanitarianTerms.forEach(term =&gt; {
          const pill = document.createElement(&#x27;span&#x27;);
          pill.className = &#x27;had-pill&#x27;;
          pill.textContent = term;
          terms.appendChild(pill);
        });
        const source = dataset.dataSource || &#x27;OpenAlex&#x27;;
        if (dataset.pubmedQueries) {
          const lines = [];
          lines.push(&#x27;PubMed retrieval query structure, run once per journal:&#x27;);
          lines.push(&#x27;&#x27;);
          lines.push(dataset.pubmedSearch);
          lines.push(&#x27;AND&#x27;);
          lines.push(&#x27;(&lt;journal names&gt;[Journal])&#x27;);
          lines.push(&#x27;AND&#x27;);
          lines.push((dataset.dateRange?.since || &#x27;&#x27;).toString() + &#x27;:&#x27; + (dataset.dateRange?.until || &#x27;&#x27;).toString() + &#x27;[dp]&#x27;);
          lines.push(&#x27;&#x27;);
          lines.push(&#x27;Full query examples by journal:&#x27;);
          Object.entries(dataset.pubmedQueries).slice(0, 12).forEach(([journal, query]) =&gt; {
            lines.push(&#x27;&#x27;);
            lines.push(journal + &#x27;:&#x27;);
            lines.push(query);
          });
          if (Object.keys(dataset.pubmedQueries).length &gt; 12) {
            lines.push(&#x27;&#x27;);
            lines.push(&#x27;Additional journal queries use the same structure and are listed in dashboard-data.json.&#x27;);
          }
          lines.push(&#x27;&#x27;);
          lines.push(&#x27;Local audit screen after PubMed retrieval:&#x27;);
          lines.push(&#x27;Fetched title + abstract must visibly contain at least one humanitarian term and at least one selected crisis geography term.&#x27;);
          lines.push(&#x27;&#x27;);
          lines.push(&#x27;Selected crisis geography terms:&#x27;);
          crises.forEach(crisis =&gt; {
            lines.push(crisis.name + &#x27;: &#x27; + crisis.geoTerms.join(&#x27; OR &#x27;));
          });
          root.querySelector(&#x27;[data-query-summary]&#x27;).textContent = &#x27;PubMed retrieval and local audit logic&#x27;;
          root.querySelector(&#x27;[data-query]&#x27;).textContent = lines.join(String.fromCharCode(10));
          return;
        }
        root.querySelector(&#x27;[data-query-summary]&#x27;).textContent = source + &#x27; retrieval query&#x27;;
        root.querySelector(&#x27;[data-query]&#x27;).textContent = dataset.openAlexSearch;
      }

      function renderCorpusControls() {
        const select = root.querySelector(&#x27;[data-corpus]&#x27;);
        select.innerHTML = &#x27;&#x27;;
        corpora.forEach(corpus =&gt; {
          const option = document.createElement(&#x27;option&#x27;);
          option.value = corpus.id;
          option.textContent = corpus.name + &#x27; (&#x27; + fmt.format(corpus.journalKeys.length) + &#x27;)&#x27;;
          select.appendChild(option);
        });
        select.value = selectedCorpusId;
      }

      function renderJournalControls() {
        const corpus = corpusById(selectedCorpusId);
        const selected = selectedJournalsByCorpus[selectedCorpusId] || new Set(corpus.journalKeys);
        const controls = root.querySelector(&#x27;[data-journal-controls]&#x27;);
        controls.innerHTML = &#x27;&#x27;;
        corpus.journalKeys.forEach(journalKey =&gt; {
          const journal = journalByKey[journalKey] || { key: journalKey };
          const label = document.createElement(&#x27;label&#x27;);
          label.className = &#x27;had-chip&#x27;;
          const input = document.createElement(&#x27;input&#x27;);
          input.type = &#x27;checkbox&#x27;;
          input.name = &#x27;journal&#x27;;
          input.value = journal.key;
          input.checked = selected.has(journal.key);
          input.addEventListener(&#x27;change&#x27;, () =&gt; {
            if (input.checked) selected.add(journal.key);
            else selected.delete(journal.key);
            if (!selected.size) {
              input.checked = true;
              selected.add(journal.key);
            }
            render();
          });
          label.append(input, document.createTextNode(&#x27; &#x27; + journal.key));
          controls.appendChild(label);
        });
      }

      function csvEscape(value) {
        const text = String(value ?? &#x27;&#x27;);
        const quote = String.fromCharCode(34);
        const lineBreak = String.fromCharCode(10);
        if (text.includes(quote) || text.includes(&#x27;,&#x27;) || text.includes(lineBreak)) {
          return quote + text.replaceAll(quote, quote + quote) + quote;
        }
        return text;
      }

      function buildArticleCsv() {
        const lineBreak = String.fromCharCode(10);
        const headers = [&#x27;journal&#x27;, &#x27;date&#x27;, &#x27;year&#x27;, &#x27;crisis&#x27;, &#x27;title&#x27;, &#x27;doi&#x27;, &#x27;source_id&#x27;, &#x27;matched_humanitarian_terms&#x27;, &#x27;matched_geo_terms&#x27;, &#x27;has_abstract&#x27;, &#x27;open_access&#x27;, &#x27;url&#x27;];
        const active = activeJournals();
        const rows = dataset.articles.filter(article =&gt; active.includes(article.journal)).map(article =&gt; [
          article.journal,
          article.date,
          article.year,
          article.crisis,
          article.title,
          article.doi,
          article.id,
          article.matchedHumanitarianTerms.join(&#x27;; &#x27;),
          article.matchedGeoTerms.join(&#x27;; &#x27;),
          article.hasAbstract,
          article.openAccess,
          article.url,
        ].map(csvEscape).join(&#x27;,&#x27;));
        return [headers.join(&#x27;,&#x27;), ...rows].join(lineBreak) + lineBreak;
      }

      function buildCandidateCsv() {
        const lineBreak = String.fromCharCode(10);
        const headers = [&#x27;journal&#x27;, &#x27;date&#x27;, &#x27;year&#x27;, &#x27;review_status&#x27;, &#x27;matched_selected_crises&#x27;, &#x27;matched_unsupported_regions&#x27;, &#x27;title&#x27;, &#x27;doi&#x27;, &#x27;source_id&#x27;, &#x27;matched_humanitarian_terms&#x27;, &#x27;matched_selected_geo_terms&#x27;, &#x27;matched_unsupported_geo_terms&#x27;, &#x27;has_abstract&#x27;, &#x27;open_access&#x27;, &#x27;url&#x27;];
        const active = activeJournals();
        const rows = dataset.candidates.filter(candidate =&gt; active.includes(candidate.journal)).map(candidate =&gt; [
          candidate.journal,
          candidate.date,
          candidate.year,
          candidate.reviewStatus,
          candidate.matchedSelectedCrises.join(&#x27;; &#x27;),
          candidate.unsupportedMatches.map(match =&gt; match.name).join(&#x27;; &#x27;),
          candidate.title,
          candidate.doi,
          candidate.id,
          candidate.matchedHumanitarianTerms.join(&#x27;; &#x27;),
          candidate.matchedSelectedGeoTerms.join(&#x27;; &#x27;),
          candidate.unsupportedMatches.flatMap(match =&gt; match.matchedGeoTerms).join(&#x27;; &#x27;),
          candidate.hasAbstract,
          candidate.openAccess,
          candidate.url,
        ].map(csvEscape).join(&#x27;,&#x27;));
        return [headers.join(&#x27;,&#x27;), ...rows].join(lineBreak) + lineBreak;
      }

      function render() {
        const { rows, totalObserved, active } = model();
        renderStats(rows, totalObserved, active);
        renderBars(rows);
        renderDetail(rows, active);
        renderCandidateReview(active);
        updateInputCells(rows);
        renderMethodology(active);
      }

      root.querySelector(&#x27;[data-corpus]&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; {
        selectedCorpusId = event.target.value;
        renderJournalControls();
        render();
      });
      root.querySelector(&#x27;[data-sort]&#x27;).addEventListener(&#x27;change&#x27;, render);
      root.querySelector(&#x27;[data-denominator-sort]&#x27;).addEventListener(&#x27;change&#x27;, render);
      root.querySelector(&#x27;[data-review-status]&#x27;).addEventListener(&#x27;change&#x27;, render);
      root.querySelector(&#x27;[data-download]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const articleCsv = buildArticleCsv();
        const blob = new Blob([articleCsv], { type: &#x27;text/csv;charset=utf-8&#x27; });
        const url = URL.createObjectURL(blob);
        const link = document.createElement(&#x27;a&#x27;);
        link.href = url;
        link.download = &#x27;humanitarian-article-matches.csv&#x27;;
        link.click();
        URL.revokeObjectURL(url);
      });
      root.querySelector(&#x27;[data-download-candidates]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const candidateCsv = buildCandidateCsv();
        const blob = new Blob([candidateCsv], { type: &#x27;text/csv;charset=utf-8&#x27; });
        const url = URL.createObjectURL(blob);
        const link = document.createElement(&#x27;a&#x27;);
        link.href = url;
        link.download = &#x27;humanitarian-candidate-review.csv&#x27;;
        link.click();
        URL.revokeObjectURL(url);
      });
      renderCorpusControls();
      renderJournalControls();
      renderInputTable();
      renderDictionary();
      render();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
