  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;div id=&quot;humanitarian-attention-dashboard-auditable&quot; class=&quot;had-shell&quot;&gt;
  &lt;style&gt;
    #humanitarian-attention-dashboard-auditable {
      --had-bg: var(--background, #fbfaf8);
      --had-fg: var(--foreground, #191714);
      --had-muted: var(--muted-foreground, #68635d);
      --had-border: var(--border, #d8d2c8);
      --had-card: var(--card, #fffdfa);
      --had-soft: color-mix(in srgb, var(--muted, #ece7df) 70%, transparent);
      --had-observed: var(--viz-series-1, #2d6cdf);
      --had-expected: var(--viz-series-2, #a05a2c);
      --had-positive: var(--viz-series-3, #247a55);
      --had-negative: var(--viz-series-4, #a04444);
      color: var(--had-fg);
      background: transparent;
      font-size: var(--font-size-base, 14px);
    }

    #humanitarian-attention-dashboard-auditable * {
      box-sizing: border-box;
    }

    #humanitarian-attention-dashboard-auditable .had-panel {
      border: 1px solid var(--had-border);
      background: color-mix(in srgb, var(--had-card) 92%, var(--had-bg) 8%);
      border-radius: 8px;
      padding: 14px;
    }

    #humanitarian-attention-dashboard-auditable .had-top {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    #humanitarian-attention-dashboard-auditable .had-stat-label,
    #humanitarian-attention-dashboard-auditable .had-source,
    #humanitarian-attention-dashboard-auditable .had-table th,
    #humanitarian-attention-dashboard-auditable .had-note,
    #humanitarian-attention-dashboard-auditable .had-small {
      color: var(--had-muted);
    }

    #humanitarian-attention-dashboard-auditable .had-stat-value {
      margin-top: 7px;
      font-weight: 500;
      font-size: 1.35em;
    }

    #humanitarian-attention-dashboard-auditable .had-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    #humanitarian-attention-dashboard-auditable .had-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    #humanitarian-attention-dashboard-auditable .had-tab {
      color: var(--had-fg);
      text-decoration: none;
      cursor: pointer;
    }

    #humanitarian-attention-dashboard-auditable .had-tab[aria-selected=&quot;true&quot;] {
      border-color: var(--ring, #5d7bd8);
      background: color-mix(in srgb, var(--accent, #e9edf8) 34%, transparent);
      font-weight: 500;
    }

    #humanitarian-attention-dashboard-auditable .had-control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    #humanitarian-attention-dashboard-auditable .had-journal-group {
      flex: 1 1 100%;
      align-items: stretch;
    }

    #humanitarian-attention-dashboard-auditable .had-journal-break {
      flex: 1 0 100%;
      height: 0;
    }

    #humanitarian-attention-dashboard-auditable .had-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--had-border);
      border-radius: 8px;
      padding: 7px 9px;
      background: color-mix(in srgb, var(--had-card) 86%, var(--had-soft) 14%);
      min-height: 34px;
    }

    #humanitarian-attention-dashboard-auditable select,
    #humanitarian-attention-dashboard-auditable input {
      color: var(--had-fg);
      background: var(--had-bg);
      border: 1px solid var(--had-border);
      border-radius: 6px;
      padding: 6px 8px;
      min-height: 32px;
    }

    #humanitarian-attention-dashboard-auditable input[type=&quot;checkbox&quot;] {
      min-height: auto;
      width: 16px;
      height: 16px;
      padding: 0;
    }

    #humanitarian-attention-dashboard-auditable button {
      color: inherit;
      font: inherit;
    }

    #humanitarian-attention-dashboard-auditable .had-section {
      margin-top: 12px;
    }

    #humanitarian-attention-dashboard-auditable .had-tab-panel[hidden] {
      display: none;
    }

    #humanitarian-attention-dashboard-auditable .had-main {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
      gap: 12px;
      align-items: start;
    }

    #humanitarian-attention-dashboard-auditable .had-chart-header,
    #humanitarian-attention-dashboard-auditable .had-detail-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    #humanitarian-attention-dashboard-auditable .had-title {
      font-weight: 500;
    }

    #humanitarian-attention-dashboard-auditable .had-source {
      text-align: right;
    }

    #humanitarian-attention-dashboard-auditable .had-bars {
      display: grid;
      gap: 9px;
    }

    #humanitarian-attention-dashboard-auditable .had-chronology {
      margin-top: 10px;
    }

    #humanitarian-attention-dashboard-auditable .had-chronology svg {
      display: block;
      width: 100%;
      height: auto;
    }

    #humanitarian-attention-dashboard-auditable .had-row {
      display: grid;
      grid-template-columns: minmax(112px, 150px) minmax(0, 1fr) minmax(66px, 84px);
      gap: 10px;
      align-items: center;
      padding: 7px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    #humanitarian-attention-dashboard-auditable .had-row[aria-selected=&quot;true&quot;] {
      border-color: var(--ring, #5d7bd8);
      background: color-mix(in srgb, var(--accent, #e9edf8) 22%, transparent);
    }

    #humanitarian-attention-dashboard-auditable .had-name {
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    #humanitarian-attention-dashboard-auditable .had-track {
      position: relative;
      height: 30px;
      border-radius: 6px;
      background: var(--had-soft);
      overflow: hidden;
    }

    #humanitarian-attention-dashboard-auditable .had-bar,
    #humanitarian-attention-dashboard-auditable .had-expected {
      position: absolute;
      left: 0;
      height: 8px;
      border-radius: 5px;
      min-width: 1px;
    }

    #humanitarian-attention-dashboard-auditable .had-bar {
      top: 6px;
      background: color-mix(in srgb, var(--had-observed) 86%, transparent);
    }

    #humanitarian-attention-dashboard-auditable .had-expected {
      bottom: 6px;
      background: color-mix(in srgb, var(--had-expected) 78%, transparent);
    }

    #humanitarian-attention-dashboard-auditable .had-ratio {
      text-align: right;
      font-weight: 500;
    }

    #humanitarian-attention-dashboard-auditable .had-ratio.under {
      color: var(--had-negative);
    }

    #humanitarian-attention-dashboard-auditable .had-ratio.over {
      color: var(--had-positive);
    }

    #humanitarian-attention-dashboard-auditable .had-legend,
    #humanitarian-attention-dashboard-auditable .had-term-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    #humanitarian-attention-dashboard-auditable .had-methodology {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    #humanitarian-attention-dashboard-auditable .had-methodology-block {
      border-top: 1px solid var(--had-border);
      padding-top: 10px;
    }

    #humanitarian-attention-dashboard-auditable .had-methodology-block:first-child {
      border-top: 0;
      padding-top: 0;
    }

    #humanitarian-attention-dashboard-auditable .had-methodology-block h4 {
      margin: 0 0 5px;
      font: inherit;
      font-weight: 500;
    }

    #humanitarian-attention-dashboard-auditable .had-methodology-block p {
      margin: 0;
    }

    #humanitarian-attention-dashboard-auditable .had-methodology-block ul {
      margin: 6px 0 0;
      padding-left: 18px;
    }

    #humanitarian-attention-dashboard-auditable .had-methodology-block li + li {
      margin-top: 4px;
    }

    #humanitarian-attention-dashboard-auditable .had-swatch {
      width: 18px;
      height: 8px;
      border-radius: 5px;
      display: inline-block;
      margin-right: 5px;
      vertical-align: middle;
    }

    #humanitarian-attention-dashboard-auditable .observed {
      background: color-mix(in srgb, var(--had-observed) 86%, transparent);
    }

    #humanitarian-attention-dashboard-auditable .expected {
      background: color-mix(in srgb, var(--had-expected) 78%, transparent);
    }

    #humanitarian-attention-dashboard-auditable .had-pill {
      display: inline-flex;
      border: 1px solid var(--had-border);
      border-radius: 999px;
      padding: 3px 7px;
      background: color-mix(in srgb, var(--had-card) 80%, var(--had-soft) 20%);
      color: var(--had-fg);
    }

    #humanitarian-attention-dashboard-auditable .had-detail {
      display: grid;
      gap: 12px;
    }

    #humanitarian-attention-dashboard-auditable .had-split-row {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr) 46px;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    #humanitarian-attention-dashboard-auditable .had-mini-track {
      height: 10px;
      border-radius: 5px;
      background: var(--had-soft);
      overflow: hidden;
    }

    #humanitarian-attention-dashboard-auditable .had-mini-bar {
      height: 10px;
      border-radius: 5px;
      background: color-mix(in srgb, var(--had-observed) 76%, transparent);
    }

    #humanitarian-attention-dashboard-auditable .had-article-list,
    #humanitarian-attention-dashboard-auditable .had-candidate-list {
      display: grid;
      gap: 8px;
      max-height: 420px;
      overflow: auto;
      padding-right: 3px;
    }

    #humanitarian-attention-dashboard-auditable .had-article,
    #humanitarian-attention-dashboard-auditable .had-candidate {
      border-top: 1px solid var(--had-border);
      padding-top: 8px;
    }

    #humanitarian-attention-dashboard-auditable .had-article a,
    #humanitarian-attention-dashboard-auditable .had-candidate a {
      color: var(--had-fg);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    #humanitarian-attention-dashboard-auditable .had-review-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    #humanitarian-attention-dashboard-auditable .had-review-stat {
      border-top: 1px solid var(--had-border);
      padding-top: 8px;
    }

    #humanitarian-attention-dashboard-auditable .had-table-wrap {
      overflow-x: auto;
      margin-top: 12px;
    }

    #humanitarian-attention-dashboard-auditable .had-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    #humanitarian-attention-dashboard-auditable .had-table th,
    #humanitarian-attention-dashboard-auditable .had-table td {
      text-align: left;
      border-bottom: 1px solid var(--had-border);
      padding: 8px 6px;
      vertical-align: middle;
    }

    #humanitarian-attention-dashboard-auditable .had-table td:nth-child(n+2),
    #humanitarian-attention-dashboard-auditable .had-table th:nth-child(n+2) {
      text-align: right;
    }

    #humanitarian-attention-dashboard-auditable .had-table .had-period {
      text-align: left;
    }

    #humanitarian-attention-dashboard-auditable .had-table input {
      width: 76px;
      text-align: right;
    }

    #humanitarian-attention-dashboard-auditable details {
      margin-top: 12px;
    }

    #humanitarian-attention-dashboard-auditable summary {
      cursor: pointer;
      font-weight: 500;
    }

    #humanitarian-attention-dashboard-auditable pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--had-fg);
      background: var(--had-soft);
      border-radius: 8px;
      padding: 10px;
    }

    @media (max-width: 760px) {
      #humanitarian-attention-dashboard-auditable .had-top,
      #humanitarian-attention-dashboard-auditable .had-main,
      #humanitarian-attention-dashboard-auditable .had-review-grid {
        grid-template-columns: 1fr;
      }

      #humanitarian-attention-dashboard-auditable .had-row {
        grid-template-columns: minmax(96px, 120px) minmax(0, 1fr) 62px;
      }

      #humanitarian-attention-dashboard-auditable .had-source {
        text-align: left;
      }
    }

          return;
        }

        const width = 980;
        const height = 230;
        const margin = { top: 18, right: 12, bottom: 48, left: 34 };
        const plotWidth = width - margin.left - margin.right;
        const plotHeight = height - margin.top - margin.bottom;
        const maxCount = Math.max(...months.map(month =&gt; counts[month]), 1);
        const gap = 2;
        const barWidth = Math.max(1, plotWidth / months.length - gap);
        const labelEvery = months.length &gt; 36 ? 6 : months.length &gt; 18 ? 3 : 1;
        const svg = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;svg&#x27;);
        svg.setAttribute(&#x27;viewBox&#x27;, &#x27;0 0 &#x27; + width + &#x27; &#x27; + height);
        svg.setAttribute(&#x27;role&#x27;, &#x27;img&#x27;);
        svg.setAttribute(&#x27;aria-label&#x27;, &#x27;Monthly counted article-crisis matches for the selected journals.&#x27;);

        const axis = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;line&#x27;);
        axis.setAttribute(&#x27;x1&#x27;, String(margin.left));
        axis.setAttribute(&#x27;x2&#x27;, String(width - margin.right));
        axis.setAttribute(&#x27;y1&#x27;, String(height - margin.bottom));
        axis.setAttribute(&#x27;y2&#x27;, String(height - margin.bottom));
        axis.setAttribute(&#x27;stroke&#x27;, &#x27;var(--had-border)&#x27;);
        axis.setAttribute(&#x27;stroke-width&#x27;, &#x27;1&#x27;);
        svg.appendChild(axis);

        [0, maxCount].forEach(value =&gt; {
          const y = margin.top + plotHeight - (value / maxCount) * plotHeight;
          const label = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;text&#x27;);
          label.setAttribute(&#x27;x&#x27;, String(margin.left - 8));
          label.setAttribute(&#x27;y&#x27;, String(y + 4));
          label.setAttribute(&#x27;text-anchor&#x27;, &#x27;end&#x27;);
          label.setAttribute(&#x27;fill&#x27;, &#x27;var(--had-muted)&#x27;);
          label.textContent = fmt.format(value);
          svg.appendChild(label);
        });

        months.forEach((month, index) =&gt; {
          const value = counts[month];
          const x = margin.left + index * (plotWidth / months.length);
          const barHeight = value ? Math.max(2, value / maxCount * plotHeight) : 0;
          const y = margin.top + plotHeight - barHeight;
          const rect = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;rect&#x27;);
          rect.setAttribute(&#x27;x&#x27;, String(x));
          rect.setAttribute(&#x27;y&#x27;, String(y));
          rect.setAttribute(&#x27;width&#x27;, String(barWidth));
          rect.setAttribute(&#x27;height&#x27;, String(barHeight));
          rect.setAttribute(&#x27;rx&#x27;, &#x27;2&#x27;);
          rect.setAttribute(&#x27;fill&#x27;, &#x27;color-mix(in srgb, var(--had-observed) 82%, transparent)&#x27;);
          const title = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;title&#x27;);
          title.textContent = monthLabel(month) + &#x27;: &#x27; + fmt.format(value);
          rect.appendChild(title);
          svg.appendChild(rect);

          if (index % labelEvery === 0 || index === months.length - 1) {
            const tick = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;text&#x27;);
            tick.setAttribute(&#x27;x&#x27;, String(x + barWidth / 2));
            tick.setAttribute(&#x27;y&#x27;, String(height - margin.bottom + 18));
            tick.setAttribute(&#x27;text-anchor&#x27;, &#x27;middle&#x27;);
            tick.setAttribute(&#x27;fill&#x27;, &#x27;var(--had-muted)&#x27;);
            tick.setAttribute(&#x27;transform&#x27;, &#x27;rotate(-35 &#x27; + (x + barWidth / 2) + &#x27; &#x27; + (height - margin.bottom + 18) + &#x27;)&#x27;);
            tick.textContent = monthLabel(month);
            svg.appendChild(tick);
          }
        });
        holder.appendChild(svg);
      }

      function candidateTerms(candidate) {
        const parts = [];
        if (candidate.matchedHumanitarianTerms.length) parts.push(&#x27;humanitarian: &#x27; + candidate.matchedHumanitarianTerms.join(&#x27;; &#x27;));
        if (candidate.matchedSelectedCrises.length) parts.push(&#x27;selected crisis: &#x27; + candidate.matchedSelectedCrises.join(&#x27;; &#x27;));
        if (candidate.matchedSelectedGeoTerms.length) parts.push(&#x27;selected geography: &#x27; + candidate.matchedSelectedGeoTerms.join(&#x27;; &#x27;));
        if (candidate.unsupportedMatches.length) parts.push(&#x27;unsupported: &#x27; + candidate.unsupportedMatches.map(match =&gt; match.name).join(&#x27;; &#x27;));
        return parts.length ? parts.join(&#x27; - &#x27;) : &#x27;no title/abstract-visible humanitarian term&#x27;;
      }

      function reviewCandidates(active) {
        const selected = root.querySelector(&#x27;[data-review-status]&#x27;).value;
        return dataset.candidates
          .filter(candidate =&gt; active.includes(candidate.journal))
          .filter(candidate =&gt; {
            if (selected === &#x27;all&#x27;) return true;
            if (selected === &#x27;uncounted&#x27;) return candidate.reviewStatus !== &#x27;counted-selected-crisis&#x27;;
            return candidate.reviewStatus === selected;
          })
          .sort((a, b) =&gt; {
            const statusCompare = String(a.reviewStatus).localeCompare(String(b.reviewStatus));
            if (selected === &#x27;all&#x27; &amp;&amp; statusCompare) return statusCompare;
            return String(b.date).localeCompare(String(a.date));
          });
      }

        const list = root.querySelector(&#x27;[data-candidate-list]&#x27;);

        const statuses = [&#x27;counted-selected-crisis&#x27;, &#x27;unsupported-geography&#x27;, &#x27;visible-humanitarian-no-geography&#x27;, &#x27;openalex-only&#x27;];

      function denominatorRows(rows) {
        const ordered = [...rows];
        const sortValue = root.querySelector(&#x27;[data-denominator-sort]&#x27;).value;
        ordered.sort((a, b) =&gt; {
          if (sortValue === &#x27;severity-desc&#x27;) return b.severity - a.severity;
          if (sortValue === &#x27;pin-desc&#x27;) return b.pin - a.pin;
          if (sortValue === &#x27;months-desc&#x27;) return b.months - a.months;
          if (sortValue === &#x27;audited-desc&#x27;) return b.observed - a.observed || b.burden - a.burden;
          if (sortValue === &#x27;name-asc&#x27;) return a.name.localeCompare(b.name);
          return b.burden - a.burden;
        });
        return ordered;
      }

            [
              &#x27;Inclusion criteria: indexed and searchable in PubMed; health, medicine, public health, humanitarian, conflict, disaster, migration, infectious disease, or regional-health scope; plausible venue for humanitarian-crisis health work; English title metadata available for reproducible journal-field queries.&#x27;,
              &#x27;Coverage criteria: deliberately broadens beyond prestige general medical journals into global/public health, humanitarian/conflict/disaster/migration, infectious disease and outbreak, regional health, and open-access clinical/public-health outlets.&#x27;,
              &#x27;Exclusion criteria: journals whose scope is mainly laboratory, highly subspecialty clinical, non-health, non-PubMed, or not plausibly relevant to population-level humanitarian crisis work were not included at this stage.&#x27;,
              &#x27;The selection is not a formal bibliometric sample of the global literature, and it does not cover all languages, disciplines, regional outlets, or non-PubMed sources.&#x27;,

        addMethodologyBlock(

            lines.push(&#x27;&#x27;);
            lines.push(&#x27;Additional journal queries use the same structure and are listed in dashboard-data.json.&#x27;);
          }
          lines.push(&#x27;&#x27;);
          lines.push(&#x27;Local audit screen after PubMed retrieval:&#x27;);
          lines.push(&#x27;Fetched title + abstract must visibly contain at least one humanitarian term and at least one selected crisis geography term.&#x27;);
          lines.push(&#x27;&#x27;);
          lines.push(&#x27;Selected crisis geography terms:&#x27;);
          crises.forEach(crisis =&gt; {
            lines.push(crisis.name + &#x27;: &#x27; + crisis.geoTerms.join(&#x27; OR &#x27;));
          });
          root.querySelector(&#x27;[data-query-summary]&#x27;).textContent = &#x27;PubMed retrieval and local audit logic&#x27;;
          root.querySelector(&#x27;[data-query]&#x27;).textContent = lines.join(String.fromCharCode(10));
          return;
        }
        root.querySelector(&#x27;[data-query-summary]&#x27;).textContent = source + &#x27; retrieval query&#x27;;
        root.querySelector(&#x27;[data-query]&#x27;).textContent = dataset.openAlexSearch;
      }

      function renderCorpusControls() {
        const select = root.querySelector(&#x27;[data-corpus]&#x27;);
        select.innerHTML = &#x27;&#x27;;
        corpora.forEach(corpus =&gt; {
          const option = document.createElement(&#x27;option&#x27;);
          option.value = corpus.id;
          option.textContent = corpus.name + &#x27; (&#x27; + fmt.format(corpus.journalKeys.length) + &#x27;)&#x27;;
          select.appendChild(option);
        });
        select.value = selectedCorpusId;
      }

      function renderJournalControls() {
        const corpus = corpusById(selectedCorpusId);
        const selected = selectedJournalsByCorpus[selectedCorpusId] || new Set(corpus.journalKeys);
        const controls = root.querySelector(&#x27;[data-journal-controls]&#x27;);
        const sortByLabel = (a, b) =&gt; journalLabel(a).localeCompare(journalLabel(b), &#x27;en&#x27;, { sensitivity: &#x27;base&#x27; });
        const coreKeys = corpus.journalKeys.filter(journalKey =&gt; coreJournalKeys.has(journalKey)).sort(sortByLabel);
        const otherKeys = corpus.journalKeys.filter(journalKey =&gt; !coreJournalKeys.has(journalKey)).sort(sortByLabel);
        const displayKeys = coreKeys.concat(otherKeys);
        controls.innerHTML = &#x27;&#x27;;
        displayKeys.forEach((journalKey, index) =&gt; {
          if (index === coreKeys.length &amp;&amp; coreKeys.length &amp;&amp; otherKeys.length) {
            const lineBreak = document.createElement(&#x27;span&#x27;);
            lineBreak.className = &#x27;had-journal-break&#x27;;
            controls.appendChild(lineBreak);
          }
          const journal = journalByKey[journalKey] || { key: journalKey };
          const label = document.createElement(&#x27;label&#x27;);
          label.className = &#x27;had-chip&#x27;;
          const input = document.createElement(&#x27;input&#x27;);
          input.type = &#x27;checkbox&#x27;;
          input.name = &#x27;journal&#x27;;
          input.value = journal.key;
          input.checked = selected.has(journal.key);
          input.addEventListener(&#x27;change&#x27;, () =&gt; {
            if (input.checked) selected.add(journal.key);
            else selected.delete(journal.key);
            if (!selected.size) {
              input.checked = true;
              selected.add(journal.key);
            }
            render();
          });
          label.append(input, document.createTextNode(&#x27; &#x27; + journalLabel(journal.key)));
          controls.appendChild(label);
        });
      }

      function csvEscape(value) {
        const text = String(value ?? &#x27;&#x27;);
        const quote = String.fromCharCode(34);
        const lineBreak = String.fromCharCode(10);
        if (text.includes(quote) || text.includes(&#x27;,&#x27;) || text.includes(lineBreak)) {
          return quote + text.replaceAll(quote, quote + quote) + quote;
        }
        return text;
      }

      function buildArticleCsv() {
        const lineBreak = String.fromCharCode(10);
        const headers = [&#x27;journal&#x27;, &#x27;date&#x27;, &#x27;year&#x27;, &#x27;crisis&#x27;, &#x27;title&#x27;, &#x27;doi&#x27;, &#x27;source_id&#x27;, &#x27;matched_humanitarian_terms&#x27;, &#x27;matched_geo_terms&#x27;, &#x27;has_abstract&#x27;, &#x27;open_access&#x27;, &#x27;url&#x27;];
        const active = activeJournals();
        const rows = dataset.articles.filter(article =&gt; active.includes(article.journal)).map(article =&gt; [
          article.journal,
          article.date,
          article.year,
          article.crisis,
          article.title,
          article.doi,
          article.id,
          article.matchedHumanitarianTerms.join(&#x27;; &#x27;),
          article.matchedGeoTerms.join(&#x27;; &#x27;),
          article.hasAbstract,
          article.openAccess,
          article.url,
        ].map(csvEscape).join(&#x27;,&#x27;));
        return [headers.join(&#x27;,&#x27;), ...rows].join(lineBreak) + lineBreak;
      }

      function buildCandidateCsv() {
        const lineBreak = String.fromCharCode(10);
        const headers = [&#x27;journal&#x27;, &#x27;date&#x27;, &#x27;year&#x27;, &#x27;review_status&#x27;, &#x27;matched_selected_crises&#x27;, &#x27;matched_unsupported_regions&#x27;, &#x27;title&#x27;, &#x27;doi&#x27;, &#x27;source_id&#x27;, &#x27;matched_humanitarian_terms&#x27;, &#x27;matched_selected_geo_terms&#x27;, &#x27;matched_unsupported_geo_terms&#x27;, &#x27;has_abstract&#x27;, &#x27;open_access&#x27;, &#x27;url&#x27;];
        const active = activeJournals();
        const rows = dataset.candidates.filter(candidate =&gt; active.includes(candidate.journal)).map(candidate =&gt; [
          candidate.journal,
          candidate.date,
          candidate.year,
          candidate.reviewStatus,
          candidate.matchedSelectedCrises.join(&#x27;; &#x27;),
          candidate.unsupportedMatches.map(match =&gt; match.name).join(&#x27;; &#x27;),
          candidate.title,
          candidate.doi,
          candidate.id,
          candidate.matchedHumanitarianTerms.join(&#x27;; &#x27;),
          candidate.matchedSelectedGeoTerms.join(&#x27;; &#x27;),
          candidate.unsupportedMatches.flatMap(match =&gt; match.matchedGeoTerms).join(&#x27;; &#x27;),
          candidate.hasAbstract,
          candidate.openAccess,
          candidate.url,
        ].map(csvEscape).join(&#x27;,&#x27;));
        return [headers.join(&#x27;,&#x27;), ...rows].join(lineBreak) + lineBreak;
      }

      function render() {
        renderTabs();
        const { rows, totalObserved, active } = model();
        renderStats(rows, totalObserved, active);
        renderBars(rows);
        renderChronology(active);
        renderDetail(rows, active);
        renderCandidateReview(active);
        updateInputCells(rows);
        renderMethodology(active);
      }

      root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          selectedTabId = button.dataset.tab || &#x27;overview&#x27;;
          renderTabs();
        });
      });

      root.querySelector(&#x27;[data-corpus]&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; {
        selectedCorpusId = event.target.value;
        renderJournalControls();
        render();
      });
      root.querySelector(&#x27;[data-sort]&#x27;).addEventListener(&#x27;change&#x27;, render);
      root.querySelector(&#x27;[data-denominator-sort]&#x27;).addEventListener(&#x27;change&#x27;, render);
      root.querySelector(&#x27;[data-review-status]&#x27;).addEventListener(&#x27;change&#x27;, render);
      root.querySelector(&#x27;[data-download]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const articleCsv = buildArticleCsv();
        const blob = new Blob([articleCsv], { type: &#x27;text/csv;charset=utf-8&#x27; });
        const url = URL.createObjectURL(blob);
        const link = document.createElement(&#x27;a&#x27;);
        link.href = url;
        link.download = &#x27;humanitarian-article-matches.csv&#x27;;
        link.click();
        URL.revokeObjectURL(url);
      });
      root.querySelector(&#x27;[data-download-candidates]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const candidateCsv = buildCandidateCsv();
        const blob = new Blob([candidateCsv], { type: &#x27;text/csv;charset=utf-8&#x27; });
        const url = URL.createObjectURL(blob);
        const link = document.createElement(&#x27;a&#x27;);
        link.href = url;
        link.download = &#x27;humanitarian-candidate-review.csv&#x27;;
        link.click();
        URL.revokeObjectURL(url);
      });
      renderCorpusControls();
      renderJournalControls();
      renderInputTable();
      renderDictionary();
      render();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
